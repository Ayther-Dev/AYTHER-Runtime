name: QA

# Spec 002, BR-175 (RNF-8): the QA variant of the Runtime against the published QA Engine (the
# engine-vpx artifact of the Engine release pinned by BR-174 in
# dependencies/ayther-engine.qa.lock.json), with the audio QA tests that need no GPU.
# "Windows / QA" is a required status check of `main`.

on:
  pull_request:
    branches:
      - main

permissions:
  attestations: read
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-qa:
    name: Windows / QA
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      CI_PRESET: windows-qa
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Initialize QA logs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Set-Content artifacts/configure.log "CMake configure did not run."
          Set-Content artifacts/build.log "CMake build did not run."
          Set-Content artifacts/test.log "CTest did not run."
          Set-Content artifacts/LastTest.log "CTest did not produce LastTest.log."
          Set-Content artifacts/junit.xml '<?xml version="1.0" encoding="UTF-8"?><testsuites name="CTest did not run" tests="0" failures="0" />'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
              $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg -ErrorAction Stop).Source
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Require the published QA Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content dependencies/ayther-engine.qa.lock.json -Raw | ConvertFrom-Json
          if ($lock.selection -cne 'qa-release') {
              throw ("The QA lock still names the local development package " +
                  "'$($lock.package.id)'. The windows-qa job needs the QA Engine published by " +
                  "BR-173 and pinned by BR-174.")
          }

      - name: Bootstrap the QA Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Transcript -Path artifacts/bootstrap.log
          try {
              & ./tools/bootstrap_ayther_engine_qa.ps1 -ValidateOnly
              $enginePrefix = & ./tools/bootstrap_ayther_engine_qa.ps1 `
                  -DestinationDirectory .deps/ayther-engine-qa | Select-Object -Last 1
              if (-not $enginePrefix) {
                  throw "QA Engine bootstrap did not return a package prefix."
              }
              "AYTHER_ENGINE_PREFIX=$([IO.Path]::GetFullPath([string]$enginePrefix))" |
                  Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
              Stop-Transcript
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & cmake --preset windows-qa 2>&1 | Tee-Object -FilePath artifacts/configure.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & cmake --build --preset windows-qa 2>&1 | Tee-Object -FilePath artifacts/build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Test audio QA without GPU
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & ctest --preset windows-qa -L audio_qa -LE gpu `
              --output-junit "$($PWD.Path)/artifacts/junit.xml" 2>&1 |
              Tee-Object -FilePath artifacts/test.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Collect CTest diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          $lastTest = "out/build/windows-qa/Testing/Temporary/LastTest.log"
          if (Test-Path -LiteralPath $lastTest -PathType Leaf) {
              Copy-Item -LiteralPath $lastTest -Destination artifacts/LastTest.log -Force
          }

      - name: Upload QA logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-windows-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
