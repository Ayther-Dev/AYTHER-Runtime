name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  attestations: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Release / Windows package
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      CI_PRESET: windows-ci
      ENGINE_PLATFORM: windows
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap locked Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $enginePrefix = & ./tools/bootstrap_ayther_engine.ps1 `
              -Platform $env:ENGINE_PLATFORM `
              -Architecture x86_64 `
              -Variant engine-vpx `
              -DestinationDirectory .deps/ayther-engine
          "AYTHER_ENGINE_PREFIX=$([IO.Path]::GetFullPath([string]$enginePrefix))" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
              $vcpkgRoot = Split-Path -Parent `
                  (Get-Command vcpkg -ErrorAction Stop).Source
          }
          "VCPKG_ROOT=$vcpkgRoot" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure, build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cmake --preset $env:CI_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build --preset $env:CI_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest --preset $env:CI_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows beta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # End users get the Runtime component only; the QA tools ship with the QA Runtime.
          & cpack --config out/build/windows-ci/CPackConfig.cmake `
              -C RelWithDebInfo -G ZIP -B artifacts -D CPACK_COMPONENTS_ALL=Runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem artifacts -File -Filter *.zip)
          if ($archives.Count -ne 1) {
              throw "Expected one Windows ZIP, found $($archives.Count)."
          }
          $archives | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS-windows.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  # Spec 002, BR-179: the QA Runtime (QA session built in, published QA Engine) with the `qa`
  # component it works with: ayther_audio_qa and ayther_replay_qa, in one archive.
  package-windows-qa:
    name: Release / Windows QA package
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap the QA Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./tools/bootstrap_ayther_engine_qa.ps1 -ValidateOnly
          $enginePrefix = & ./tools/bootstrap_ayther_engine_qa.ps1 `
              -DestinationDirectory .deps/ayther-engine-qa | Select-Object -Last 1
          if (-not $enginePrefix) {
              throw "QA Engine bootstrap did not return a package prefix."
          }
          "AYTHER_ENGINE_PREFIX=$([IO.Path]::GetFullPath([string]$enginePrefix))" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
              $vcpkgRoot = Split-Path -Parent `
                  (Get-Command vcpkg -ErrorAction Stop).Source
          }
          "VCPKG_ROOT=$vcpkgRoot" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure, build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cmake --preset windows-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build --preset windows-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest --preset windows-qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows QA beta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch 'set\(AYTHER_RUNTIME_VERSION "([^"]+)"\)') {
              throw "AYTHER_RUNTIME_VERSION is missing."
          }
          $name = "ayther-runtime-qa-$($Matches[1])-Windows-AMD64"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & cpack --config out/build/windows-qa/CPackConfig.cmake `
              -C RelWithDebInfo -G ZIP -B artifacts `
              -D CPACK_COMPONENTS_ALL="Runtime;qa" `
              -D CPACK_ARCHIVE_COMPONENT_INSTALL=OFF `
              -D CPACK_PACKAGE_FILE_NAME=$name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem artifacts -File -Filter *.zip)
          if ($archives.Count -ne 1) {
              throw "Expected one Windows QA ZIP, found $($archives.Count)."
          }

          # The QA tools must work with the Runtime of the same archive.
          $smoke = Join-Path $env:RUNNER_TEMP "qa-package"
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $smoke
          $bin = Get-ChildItem $smoke -Recurse -Directory -Filter bin | Select-Object -First 1
          if (-not $bin) { throw "The QA archive has no bin directory." }
          foreach ($tool in @("ayther_runtime.exe", "ayther_audio_qa.exe", "ayther_replay_qa.exe")) {
              if (-not (Test-Path -LiteralPath (Join-Path $bin.FullName $tool) -PathType Leaf)) {
                  throw "The QA archive lacks $tool."
              }
          }
          $env:SDL_VIDEO_DRIVER = "dummy"
          $env:SDL_AUDIO_DRIVER = "dummy"
          $capabilities = & (Join-Path $bin.FullName "ayther_runtime.exe") --qa-capabilities
          if ($LASTEXITCODE -ne 0 -or ($capabilities -join "") -notmatch '"runtime":\["1\.0","1\.1"\]') {
              throw "The packaged Runtime has no QA session: $capabilities"
          }
          & (Join-Path $bin.FullName "ayther_audio_qa.exe") options --format toml | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "The packaged ayther_audio_qa does not run." }
          $core = Get-ChildItem out/build/windows-qa -Recurse -File `
              -Filter synthetic_libretro_core.dll | Select-Object -First 1
          if (-not $core) { throw "The synthetic test core was not built." }
          & (Join-Path $bin.FullName "ayther_runtime.exe") --probe-core $core.FullName | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "The packaged Runtime cannot probe a core." }

          $archives | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS-windows-qa.txt

      - name: Upload Windows QA package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-qa
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Release / Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_PRESET: linux-ci
      ENGINE_PLATFORM: linux
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap locked Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $enginePrefix = & ./tools/bootstrap_ayther_engine.ps1 `
              -Platform $env:ENGINE_PLATFORM `
              -Architecture x86_64 `
              -Variant engine `
              -DestinationDirectory .deps/ayther-engine
          "AYTHER_ENGINE_PREFIX=$([IO.Path]::GetFullPath([string]$enginePrefix))" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure, build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cmake --preset $env:CI_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build --preset $env:CI_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest --preset $env:CI_PRESET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Linux beta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & cpack --config out/build/linux-ci/CPackConfig.cmake `
              -G TGZ -B artifacts -D CPACK_COMPONENTS_ALL=Runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem artifacts -File -Filter *.tar.gz)
          if ($archives.Count -ne 1) {
              throw "Expected one Linux TGZ, found $($archives.Count)."
          }
          $archives | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS-linux.txt

      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release / Publish prerelease
    needs:
      - package-windows
      - package-windows-qa
      - package-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Validate tag and publish beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch `
              'set\(AYTHER_RUNTIME_VERSION "([^"]+)"\)') {
              throw "AYTHER_RUNTIME_VERSION is missing."
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match '$expectedTag'."
          }
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
              throw "Release notes are missing: $notes"
          }
          $assets = @(Get-ChildItem artifacts -File |
              ForEach-Object { $_.FullName })
          if ($assets.Count -ne 6) {
              throw "Expected three archives and three checksum files; found $($assets.Count)."
          }
          & gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --prerelease `
              --title "AYTHER Runtime $env:GITHUB_REF_NAME" `
              --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
